<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Luminary Studio — Profilbild</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --navy: #0C2340; --gold: #D9A441; --offwhite: #F7F5F0; }
  body { background: #2a2a2a; }
  .deck { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px; }
  body.render { background: #fff; }
  body.render .deck { gap: 0; padding: 0; align-items: flex-start; }

  .pfp {
    width: 1080px; height: 1080px; flex: none; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .pfp.navy { background: var(--navy); }
  .pfp.light { background: var(--offwhite); }

  /* Gold glow behind the spark */
  .pfp::before {
    content: ""; position: absolute; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217,164,65,0.28) 0%, rgba(217,164,65,0) 62%);
  }
  .pfp.light::before { background: radial-gradient(circle, rgba(217,164,65,0.22) 0%, rgba(217,164,65,0) 62%); }

  .spark { position: relative; z-index: 2; width: 500px; height: 500px; color: var(--gold); }

  /* subtle ring on the light variant for definition */
  .pfp.light .ring {
    position: absolute; z-index: 1; width: 660px; height: 660px; border-radius: 50%;
    border: 3px solid rgba(12,35,64,0.10);
  }
</style>
</head>
<body>
  <div class="deck">

    <section class="pfp navy">
      <svg class="spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z"/>
      </svg>
    </section>

    <section class="pfp light">
      <span class="ring"></span>
      <svg class="spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z"/>
      </svg>
    </section>

  </div>
<script>
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll('.pfp'));
    var s = new URLSearchParams(location.search).get('s');
    if (s) {
      document.body.classList.add('render');
      var idx = parseInt(s, 10) - 1;
      items.forEach(function (el, i) { el.style.display = (i === idx) ? 'flex' : 'none'; });
    }
  })();
</script>
</body>
</html>
